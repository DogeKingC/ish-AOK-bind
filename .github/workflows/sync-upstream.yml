name: Sync with upstream

# Keeps this fork level with emkey1/ish-AOK without anyone having to ask.
#
# Upstream commits frequently, and every manual sync is the same four steps:
# fetch, merge, check nothing broke, push. This does them daily.
#
# The merge direction is upstream -> working, so this fork's own commits (the
# binder driver, the CI guards) are what is being merged *into* and are never
# at risk of being replaced. A merge that would touch them shows up as a
# conflict, which stops the run rather than resolving it blind.
#
# Nothing lands on `working` unless the merge was clean, this fork's own code
# is still present afterwards, and the tree still builds and passes tests --
# for BOTH engines. The i386 tests run natively; the arm64 ones run under
# qemu-user against a cross-built emulator, because the arm64 gadget set is
# aarch64-host-only and is otherwise not even compiled on this runner, which
# would let an upstream commit break it invisibly and surface only on a phone.
# Anything else opens an issue and leaves `working` untouched.
#
# When a clean merge then fails its checks, the issue also says whether a
# PRISTINE upstream tree fails the same way. That distinction decides what to
# do next -- fix the merge, or fix/wait on upstream -- and answering it by
# hand means building a second tree and comparing, which is exactly the kind
# of thing that should not be left to whoever reads the issue at 7am.

on:
  schedule:
    # 07:00 UTC daily. Cheap: ubuntu runners are the 1x billing tier, and the
    # job exits in seconds on the (common) day when there is nothing new.
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  UPSTREAM: https://github.com/emkey1/ish-AOK.git
  UPSTREAM_BRANCH: working

jobs:
  sync:
    # Same reasoning as build-dev-ipa.yml: pinned to this repository so a fork
    # of this fork does not start pushing to a repo it should not.
    if: github.repository == 'DogeKingC/ish-AOK-bind'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: working
          fetch-depth: 0
          submodules: true

      - name: Check whether upstream has anything new
        id: check
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          BEHIND=$(git rev-list --count HEAD..upstream/$UPSTREAM_BRANCH)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date with upstream."
          else
            echo "$BEHIND new upstream commit(s):"
            git log --oneline "HEAD..upstream/$UPSTREAM_BRANCH"
          fi

      - name: Merge upstream
        id: merge
        if: steps.check.outputs.behind != '0'
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Record the range now: after a successful merge, HEAD has moved and
          # the "what came in" list is no longer reachable the same way.
          {
            echo 'commits<<COMMITS_EOF'
            git log --pretty='- `%h` %s' "HEAD..upstream/$UPSTREAM_BRANCH"
            echo 'COMMITS_EOF'
          } >> "$GITHUB_OUTPUT"

          # The incoming subjects go in the merge commit body, not just the
          # step summary: six months later `git log` is where anyone looks to
          # find out what a given sync actually brought in, and a step summary
          # has long since expired.
          if git merge --no-edit --log=200 "upstream/$UPSTREAM_BRANCH"; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "conflicted<<FILES_EOF" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U >> "$GITHUB_OUTPUT"
            echo "FILES_EOF" >> "$GITHUB_OUTPUT"
            git merge --abort
            echo "clean=false" >> "$GITHUB_OUTPUT"
            # Fail the run: a conflict is the one outcome that needs a person,
            # and a green checkmark on a sync that did not happen is worse than
            # no automation at all.
            exit 1
          fi

      # A clean merge is not by itself proof this fork's work survived: an
      # upstream commit that deleted or rewrote a file we hook into would merge
      # without complaint, and most of those hooks are single lines in files
      # upstream edits regularly. The list of what to check lives in the script
      # so adding a subsystem means editing one place.
      - name: Verify this fork's own code survived the merge
        if: steps.merge.outputs.clean == 'true'
        run: sh tools/check-fork-additions.sh

      - name: Install build dependencies
        if: steps.merge.outputs.clean == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev libsqlite3-dev
          pip3 install meson ninja

      # Same build and tests as ci.yml's build-linux job, with one compiler
      # rather than the clang/gcc matrix -- this is a gate on an automated
      # push, not full CI coverage. CI still runs in full on your own pushes
      # and on pull requests.
      - name: Build and test the merged tree
        if: steps.merge.outputs.clean == 'true'
        run: |
          set -euo pipefail
          meson setup build -Dengine=jit
          ninja -C build
          meson test -C build float80 riscv64_decode --print-errorlogs
          meson test -C build e2e --print-errorlogs
        env:
          CC: clang

      # Building is not enough. binder and ashmem are drivers, so a
      # regression in them is behavioural and only shows up when a guest
      # process actually exercises the protocol -- exactly what these tests do,
      # and the same way they are run during development.
      - name: Run this fork's guest regression tests
        if: steps.merge.outputs.clean == 'true'
        run: |
          sudo apt-get install -y gcc-multilib
          bash tools/run-guest-tests.sh build

      # The i386 tests above run the i386 engine. They say nothing at all about
      # the arm64 one, which is aarch64-host-only -- on this x86_64 runner the
      # entire arm64 gadget set is not even compiled, so an upstream commit
      # that broke it would merge, build, pass everything here, and only
      # surface as a crash on someone's phone. Upstream edits jit/gen.c and the
      # gadget sets constantly, so that is the likeliest way for a sync to
      # break this fork's actual target.
      #
      # tools/run-arm64-guest-tests.sh closes that: it cross-builds iSH for
      # aarch64-linux and runs the guest tests under qemu-user. Slower than the
      # i386 pass but well inside the job timeout, and it is the only automated
      # coverage the arm64 engine has anywhere.
      - name: Set up the aarch64 cross toolchain
        if: steps.merge.outputs.clean == 'true'
        run: |
          set -euo pipefail
          # arm64 packages come from ports.ubuntu.com, not archive.ubuntu.com,
          # so the existing sources have to be pinned to amd64 first or apt
          # 404s on every arm64 index.
          sudo python3 - <<'PY'
          import glob, os
          for path in glob.glob('/etc/apt/sources.list.d/ubuntu.sources'):
              stanzas = open(path).read().split('\n\n')
              out = []
              for s in stanzas:
                  if 'Types:' in s and 'Architectures:' not in s:
                      s = s.replace('Types: deb', 'Types: deb\nArchitectures: amd64', 1)
                  out.append(s)
              open(path, 'w').write('\n\n'.join(out))
          if os.path.exists('/etc/apt/sources.list'):
              lines = open('/etc/apt/sources.list').read().splitlines()
              open('/etc/apt/sources.list', 'w').write('\n'.join(
                  l.replace('deb ', 'deb [arch=amd64] ', 1)
                  if l.startswith('deb ') and '[arch=' not in l else l
                  for l in lines) + '\n')
          open('/etc/apt/sources.list.d/ports-arm64.sources', 'w').write(
              "Types: deb\nArchitectures: arm64\n"
              "URIs: http://ports.ubuntu.com/ubuntu-ports/\n"
              "Suites: noble noble-updates\nComponents: main universe\n"
              "Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n")
          PY
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          # lld is load-bearing, not a nicety: tools/cross-aarch64.ini passes
          # -fuse-ld=lld, because without it clang falls back to the host
          # binutils ld, which rejects the target during meson's LINKER
          # DETECTION ("unrecognised emulation mode: aarch64linux") -- before
          # compiling anything, so the error names no source file.
          #
          # Two sources of the target's libgcc/crt files are installed on
          # purpose. gcc-aarch64-linux-gnu puts them under gcc-cross/, the
          # libgcc-13-dev:arm64 pair under the multiarch gcc/ path, and
          # run-arm64-guest-tests.sh looks in both. Either alone is enough
          # today; having both means a change to that glob, or a runner image
          # that drops one layout, cannot quietly turn the arm64 gate into
          # "did not compile". Missing them entirely does not look like a
          # missing package -- meson just reports that the compiler "cannot
          # compile programs" and names nothing.
          #
          # binutils is named explicitly for readelf, even though the runner
          # image has it. run-arm64-guest-tests.sh uses readelf to assert each
          # test binary is dynamically linked against musl, and that check is
          # written to SKIP ITSELF when readelf is absent rather than fail --
          # the right behaviour for a developer box, the wrong thing to leave
          # implicit in CI, where a silently skipped check is a check that is
          # not running. What it guards against is a sysroot whose libc.so
          # symlink dangles: -lc then falls back to libc.a, every test binary
          # becomes static musl carrying a PT_INTERP, and spawned threads get
          # TLS sized as though the program had none. That fails as an
          # emulator bug, not as a link problem.
          sudo apt-get install -y clang lld llvm qemu-user-static binutils \
              gcc-aarch64-linux-gnu libsqlite3-dev:arm64 \
              libgcc-13-dev:arm64 libstdc++-13-dev:arm64
          # Installing a gcc cross package can take /usr/include/asm with it,
          # which silently breaks every -m32 compile (i.e. the i386 guest tests
          # above, if the step order ever changes). Cheap to re-assert.
          if [ ! -e /usr/include/asm ]; then
            sudo ln -sfn x86_64-linux-gnu/asm /usr/include/asm
          fi

      # The full set, tagged_pointer included. It was excluded when this step
      # was written, on the grounds that its `atomics` probe failed under
      # qemu-user and passed on device -- a host artifact, since qemu clears
      # the exclusive monitor far more eagerly than a real core. That was
      # wrong: the probe was failing because the arm64 C memory helpers took
      # the guest address with its TBI tag on, and the device only survived it
      # because AArch64 ignores the top byte on a dereference. It now passes
      # everywhere, and it is the ONLY automated cover for a whole class of
      # tag bugs (the last of which made every Android memset fault), so it
      # gates the sync like everything else.
      - name: Run the arm64 guest tests under qemu-user
        if: steps.merge.outputs.clean == 'true'
        run: bash tools/run-arm64-guest-tests.sh

      - name: Push to working
        if: steps.merge.outputs.clean == 'true'
        run: git push origin working

      # Pushing with GITHUB_TOKEN deliberately does not re-trigger other
      # workflows, so a daily sync never kicks off the 90-minute macOS IPA
      # build. Use build-dev-ipa's "Run workflow" button when you actually
      # want an IPA.
      # The commit list is passed through the environment, never interpolated
      # into the script with ${{ }}: subjects come from upstream and routinely
      # contain backticks and quotes, which the shell would otherwise execute.
      - name: Report success
        if: steps.merge.outputs.clean == 'true'
        env:
          COMMITS: ${{ steps.merge.outputs.commits }}
        run: |
          {
            echo "### Synced with upstream"
            echo ""
            echo "$COMMITS"
          } >> "$GITHUB_STEP_SUMMARY"

      # A clean merge whose tree then fails is ambiguous, and the two cases
      # need opposite responses: if the merge broke it, the merge is wrong and
      # must not land; if upstream was already broken, the merge is fine and
      # what is needed is a fix on top (or a wait). Answering it by hand means
      # building a pristine upstream worktree and comparing -- so do that here
      # instead, while the runner is already warm and the toolchain installed.
      #
      # This is not hypothetical: upstream's tree has failed to LINK on x86_64
      # (fused_<op>32_imm_gadgets are defined only in the aarch64 host gadget
      # set), which looked exactly like a merge that broke the build.
      - name: Was upstream already broken, independently of this merge?
        id: baseline
        if: failure() && steps.merge.outputs.clean == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          git worktree add /tmp/upstream-baseline "upstream/$UPSTREAM_BRANCH"
          cd /tmp/upstream-baseline
          # The arm64 harness is this fork's, so bring it: upstream has no
          # equivalent and cannot be asked about arm64 any other way. It needs
          # the cross file and the meson.build gate that builds a CLI
          # executable for a Linux cross target, neither of which upstream has;
          # without the gate the cross build produces no `ish` and the arm64
          # verdict would be a toolchain artifact rather than a fact about
          # upstream, so it is skipped rather than guessed at.
          cp "$GITHUB_WORKSPACE/tools/run-arm64-guest-tests.sh" tools/ 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/tools/cross-aarch64.ini" tools/ 2>/dev/null || true
          # NOT the i386 guest tests, and this used to be wrong in a way that
          # inverted the answer. They were copied and run here, but the tests
          # they run (binder_ipc, ashmem, dma_heap, selinuxfs, ...) are fork
          # sources under tests/manual that upstream does not have, so
          # run-guest-tests.sh hit its own "no such test" path and failed --
          # every time, on every upstream tree. The verdict that produced was
          # "upstream fails the i386 guest tests too; the breakage is not from
          # this merge", which is precisely the wrong thing to tell someone at
          # 7am: it exonerates the merge unconditionally.
          #
          # Copying the test sources as well would not rescue it. They exercise
          # drivers only this fork has -- there is no /dev/binder on an upstream
          # build -- so they can say nothing about upstream either way. If they
          # fail after a merge, that IS the merge's problem (upstream changed
          # something our drivers rest on), which is exactly the default verdict
          # below. So the honest baseline is configure, build, and arm64.
          verdict="upstream configures, builds, and passes what can be asked of it; this merge is what broke it"
          if ! meson setup build -Dengine=jit >/tmp/base-cfg.log 2>&1; then
            verdict="upstream does not even CONFIGURE; the breakage is not from this merge"
          elif ! ninja -C build >/tmp/base-build.log 2>&1; then
            verdict="upstream does not BUILD either; the breakage is not from this merge"
          elif grep -q "host_machine.system() == 'linux'" meson.build 2>/dev/null &&
               ! ISH_ARM64_WORK=/tmp/base-arm64 bash tools/run-arm64-guest-tests.sh \
                   >/tmp/base-arm64.log 2>&1; then
            verdict="upstream builds but fails the arm64 guest tests too; the breakage is not from this merge"
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "$verdict"
        env:
          CC: clang

      # Conflicts and build failures both need a human, so say so somewhere
      # that does not depend on anyone reading Actions logs. One open issue at
      # a time: if the last sync is still unresolved, a new failure comments on
      # it rather than filing a duplicate every morning.
      - name: Open an issue if the sync needs a human
        if: failure() || steps.merge.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONFLICTED: ${{ steps.merge.outputs.conflicted }}
          COMMITS: ${{ steps.merge.outputs.commits }}
          CLEAN: ${{ steps.merge.outputs.clean }}
          BASELINE: ${{ steps.baseline.outputs.verdict }}
        run: |
          set -euo pipefail
          if [ "$CLEAN" = "false" ]; then
            REASON="The merge hit conflicts, so it was aborted."
            DETAIL=$'Conflicting files:\n\n```\n'"$CONFLICTED"$'\n```'
          else
            REASON="The merge was clean, but the merged tree failed its checks."
            DETAIL="One of: this fork's own code did not survive the merge (tools/check-fork-additions.sh), the build failed, the unit/e2e tests failed, this fork's i386 guest regression tests failed (tools/run-guest-tests.sh -- binder/ashmem behaviour), or the arm64 guest tests failed under qemu-user (tools/run-arm64-guest-tests.sh -- the arm64 gadget set, which nothing else here compiles). The run log says which. Two of those fail in ways worth naming in advance: (1) meson.build now passes -Werror=implicit-function-declaration, matching what the Xcode project already passes, so an upstream commit with a missing declaration stops the build HERE rather than only in the iOS build -- that is the flag working, and the fix is the missing #include, not removing the flag; (2) tools/run-arm64-guest-tests.sh refuses to run a test binary that has no DT_NEEDED for libc, which means its musl sysroot lost the ldso and every test would otherwise run against a statically linked libc with broken thread TLS."
          fi
          # The baseline verdict goes near the top: it decides whether the
          # next step is "fix the merge" or "fix/wait on upstream", and that
          # is the first thing anyone opening this issue needs to know.
          BASE_LINE=""
          if [ -n "${BASELINE:-}" ]; then
            BASE_LINE=$'\n\n**Upstream baseline:** '"$BASELINE"
          fi
          BODY=$(printf '%s%s\n\n%s\n\n`working` was left untouched.\n\nUpstream commits involved:\n\n%s\n\nRun: %s\n' \
            "$REASON" "$BASE_LINE" "$DETAIL" "${COMMITS:-(none recorded)}" "$RUN_URL")

          EXISTING=$(gh issue list --label upstream-sync --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create upstream-sync --color BFD4F2 \
              --description "Automated upstream sync needs attention" 2>/dev/null || true
            gh issue create --title "Upstream sync needs attention" \
              --label upstream-sync --body "$BODY"
          fi
