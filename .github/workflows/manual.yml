name: ARM64 emulator build + TBI check
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build (blank = default branch)"
        required: false
        default: ""
jobs:
  arm-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ inputs.ref }}

      - name: Confirm host is aarch64
        run: |
          set -eux
          uname -m
          test "$(uname -m)" = "aarch64" || { echo "NOT an arm64 runner"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y libarchive-dev libsqlite3-dev binutils gcc clang lld
          pip3 install meson ninja
          clang --version

      - name: Build with clang
        env:
          CC: clang
        run: |
          set -eux
          rm -rf build
          meson setup build -Dengine=jit
          ninja -C build
          ls -l build/ish build/tools/fakefsify

      - name: Confirm arm64 guest gadgets linked in
        run: |
          set -eu
          if nm build/ish 2>/dev/null | grep -q gadget_arm64_load64; then
            echo "OK: arm64 guest gadgets present"
          else
            echo "WARNING: arm64 guest gadgets missing - the TBI test below is meaningless"
          fi

      - name: Unit tests
        run: meson test -C build riscv64_decode --print-errorlogs
        continue-on-error: true


      - name: Build TBI probe
        run: |
          set -eux
          cat > tbi.s <<'ASM'
          .text
          .global _start
          _start:
              sub  sp, sp, #16
              mov  x0, #42
              str  x0, [sp]
              mov  x1, sp
              movz x3, #0x0200, lsl #48
              orr  x1, x1, x3
              ldr  x2, [x1]
              cmp  x2, #42
              b.ne 1f
              mov  x0, #0
              b    2f
          1:  mov  x0, #1
          2:  mov  x8, #93
              svc  #0
          ASM
          sed -i 's/^          //' tbi.s
          cat tbi.s
          gcc -static -nostdlib -nostartfiles -o tbi tbi.s
          file tbi
          set +e
          ./tbi
          echo "native exit=$? (must be 0 - real hardware ignores the top byte)"

      - name: Stage fakefs rootfs
        run: |
          set -eux
          mkdir -p rootsrc
          tar -xf alpine-minirootfs-3.23.3-aarch64.tar.xz -C rootsrc
          cp tbi rootsrc/tbi
          chmod +x rootsrc/tbi
          tar -czf rootfs.tar.gz -C rootsrc .
          ./build/tools/fakefsify rootfs.tar.gz rootfs
          ls rootfs

      - name: Control - does the arm64 guest run at all
        run: |
          set +e
          timeout 120 ./build/ish -f rootfs /bin/busybox echo control-ok
          echo "control exit=$?"

      - name: Run TBI probe under the emulator
        run: |
          set +e
          timeout 120 ./build/ish -f rootfs /tbi
          RC=$?
          echo "=================================================="
          echo "emulator exit code: $RC"
          if [ "$RC" -eq 0 ]; then
            echo "TBI PASS - tagged pointer dereferenced correctly"
          else
            echo "TBI FAIL - emulator does not ignore the top byte"
          fi
          echo "=================================================="
