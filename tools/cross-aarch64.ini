# Meson cross file: build iSH itself for an aarch64 LINUX host, so the
# arm64-GUEST gadget set (jit/guest-arm64/*.S) can be exercised from an x86_64
# machine under qemu-user. See tools/run-arm64-guest-tests.sh, which is what
# actually drives it -- this file on its own only produces a binary you still
# need qemu-aarch64-static to run.
#
# clang, not aarch64-linux-gnu-gcc, and this is not a preference: GNU binutils'
# aarch64 assembler rejects every `.req` register alias whose name begins with
# an underscore, which is all of them in jit/gadgets-aarch64/gadgets.h (_ip,
# _cpu, _tlb, _addr, _tmp). gas reports them as "expected a register" at each
# use site, so the whole host gadget set fails to assemble. clang's integrated
# assembler accepts them -- and is what the iOS build uses anyway, so this
# matches how the shipping binary is actually assembled.
#
# exe_wrapper lets meson run the build-time helpers (jit/offsets.c and
# friends) it normally executes on the build machine.

[binaries]
c = ['clang', '--target=aarch64-linux-gnu']
cpp = ['clang++', '--target=aarch64-linux-gnu']
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = '/usr/bin/pkg-config'
exe_wrapper = 'qemu-aarch64-static'

[host_machine]
system = 'linux'
kernel = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[properties]
pkg_config_libdir = '/usr/lib/aarch64-linux-gnu/pkgconfig'
